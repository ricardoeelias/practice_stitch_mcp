<body class="bg-background text-on-surface font-body-md min-h-screen">
<header class="sticky top-0 bg-white border-b border-outline-variant px-5 h-16 flex justify-between items-center">

<main class="max-w-md mx-auto px-4 pt-5 pb-28 flex flex-col gap-5">
<section>
<h1 class="text-headline-lg-mobile font-bold">Tus Salvavidas Guardados ⭐</h1>
<p id="favoritesCount" role="status" class="bg-secondary-fixed text-on-secondary-fixed rounded-full px-3 py-2 mt-2 text-label-sm w-fit">
</p>
</section>
<section>
<label class="sr-only" for="excuseSearchInput">Buscar excusas por palabra clave</label>
<div class="flex gap-2">
<input id="excuseSearchInput" type="search" placeholder="Buscar excusas por palabra clave…" class="w-full rounded-2xl border-outline-variant bg-white p-3">
<button id="clearSearchBtn" type="button" hidden aria-label="Limpiar búsqueda">✕</button>
</div>
</section>
<section aria-label="Filtrar por categoría" class="flex gap-2 overflow-x-auto py-1">
<button type="button" class="filter-pill shrink-0 rounded-full border border-outline-variant px-4 py-2 text-label-sm" data-category="Todas" aria-pressed="false">Todas</button>
<button type="button" class="filter-pill shrink-0 rounded-full border border-outline-variant px-4 py-2 text-label-sm" data-category="Trabajo" aria-pressed="false">Trabajo</button>
<button type="button" class="filter-pill shrink-0 rounded-full border border-outline-variant px-4 py-2 text-label-sm" data-category="Estudio" aria-pressed="false">Estudio</button>
<button type="button" class="filter-pill shrink-0 rounded-full border border-outline-variant px-4 py-2 text-label-sm" data-category="Vida cotidiana" aria-pressed="false">Vida cotidiana</button>
</section>
<section id="cardsList" aria-label="Excusas favoritas">
</section>
<p id="favoritesEmpty" role="status" class="bg-surface-container-high rounded-2xl p-5">
</p>

<noscript>Activa JavaScript para gestionar tus favoritas.</noscript>

<template id="favoriteTemplate">
<article class="excuse-card bg-surface-container-lowest rounded-3xl p-5 border border-outline-variant/50 card-shadow transition-all duration-200 relative flex flex-col gap-3.5 hover:border-primary/40" data-cat="cotidiana">
<!-- Card Header: Badges & Absurdity Pill -->
<div class="flex items-center justify-between gap-2">
<div class="flex items-center gap-2">
<span data-category-label class="text-primary text-label-sm">
</span>

</div>
<!-- Absurdity Pill: Delirante (Pink theme) -->
<span data-level class="bg-tertiary-fixed text-tertiary px-3 py-1 rounded-full text-label-sm">
</span>
</div>
<!-- Full Excuse Body Quote Block -->
<div class="bg-surface-container-low/70 p-4 rounded-2xl border border-outline-variant/30 relative">
<span class="material-symbols-outlined absolute right-3 top-2 text-outline-variant/40 text-3xl select-none">format_quote</span>
<p class="excuse-text text-on-surface font-headline-sm text-headline-sm leading-relaxed pr-6">
</p>
</div>

<div class="flex items-center justify-between pt-2 border-t border-outline-variant/30 mt-0.5">
<!-- Copy Quick Action -->
<button class="copy-btn inline-flex items-center gap-1.5 bg-primary-fixed text-on-primary-fixed px-4 py-2 rounded-full text-label-md font-label-md hover:bg-primary hover:text-on-primary active:scale-95 transition-all duration-150 shadow-xs">
<span class="material-symbols-outlined text-[18px]">content_copy</span>
<span>Copiar</span>
</button>
<!-- Secondary Actions: Share & Delete -->
<div class="flex items-center gap-1.5">
<button class="share-btn w-9 h-9 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center hover:bg-surface-container-high hover:text-primary active:scale-90 transition-all border border-outline-variant/30" aria-label="Compartir por WhatsApp">
<span class="material-symbols-outlined text-[18px]">share</span>
</button>
<button class="delete-trigger-btn w-9 h-9 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center hover:bg-error-container hover:text-error active:scale-90 transition-all border border-outline-variant/30" aria-label="Eliminar de favoritas">
<span class="material-symbols-outlined text-[18px]">delete</span>
</button>
</div>
</div>
</article>
</template>
<dialog id="removeFavorite" aria-labelledby="removeTitle" class="rounded-3xl p-6 max-w-sm">
<h2 id="removeTitle" class="font-bold text-xl">¿Eliminar esta favorita?</h2>
<p class="my-4">Se quitará de tus salvavidas guardados.</p>
<div class="flex gap-4">
<button id="cancelRemove" autofocus>Cancelar</button>
<button id="confirmRemove" class="bg-primary text-white rounded-full px-4 py-2">Eliminar</button>
</div>
</dialog>
