<script>
    let activeCategory = 'Todas';

    const excuseDatabase = [
      {
        cat: 'Trabajo',
        text: 'Mi gato cerró la laptop de un salto y ahora Windows está en ruso.',
        absurd: '4/5'
      },
      {
        cat: 'Trabajo',
        text: 'Mi conexión a internet fue secuestrada por una actualización de microondas inteligente.',
        absurd: '5/5'
      },
      {
        cat: 'Estudio',
        text: 'Se me desconfiguró la noción del tiempo tras intentar entender derivadas.',
        absurd: '3/5'
      },
      {
        cat: 'Estudio',
        text: 'El PDF de la entrega mutó a formato jeroglífico tras exportarlo con prisas.',
        absurd: '4/5'
      },
      {
        cat: 'Vida cotidiana',
        text: 'La gravedad en mi cama aumentó un 300% debido a una tormenta solar.',
        absurd: '5/5'
      },
      {
        cat: 'Vida cotidiana',
        text: 'Salí a comprar perejil y acabé participando como testigo en una boda gitana.',
        absurd: '4/5'
      }
    ];

    function setCategory(el, cat) {
      activeCategory = cat;
      const chips = document.querySelectorAll('.category-chip');
      chips.forEach(chip => {
        chip.className = 'category-chip flex-shrink-0 px-4 py-2 rounded-full border text-label-md font-label-md flex items-center gap-1.5 transition-all duration-200 bg-surface-container-lowest text-on-surface-variant border-outline-variant hover:bg-surface-container-high';
      });
      el.className = 'category-chip flex-shrink-0 px-4 py-2 rounded-full border text-label-md font-label-md flex items-center gap-1.5 transition-all duration-200 bg-primary-container text-on-primary-container border-primary-container shadow-[0_4px_12px_rgba(109,69,232,0.24)]';
    }

    function generateRandomExcuse() {
      const btn = document.getElementById('generateBtn');
      btn.classList.add('scale-95');
      setTimeout(() => btn.classList.remove('scale-95'), 150);

      let pool = excuseDatabase;
      if (activeCategory !== 'Todas') {
        pool = excuseDatabase.filter(e => e.cat === activeCategory);
        if (pool.length === 0) pool = excuseDatabase;
      }

      const randomItem = pool[Math.floor(Math.random() * pool.length)];

      const emptyState = document.getElementById('emptyState');
      const activeState = document.getElementById('activeState');
      const excuseText = document.getElementById('generatedExcuseText');
      const resultCat = document.getElementById('resultCategoryPill');
      const resultAbsurd = document.getElementById('resultAbsurdMeter');
      const stateBadge = document.getElementById('stateBadge');
      const container = document.getElementById('excuseCardContainer');

      emptyState.classList.add('hidden');
      activeState.classList.remove('hidden');
      activeState.classList.add('flex');

      container.classList.remove('border-dashed', 'border-primary/30');
      container.classList.add('border-solid', 'border-outline-variant/60');

      excuseText.innerText = `"${randomItem.text}"`;
      resultCat.innerText = randomItem.cat;
      resultAbsurd.innerText = `${randomItem.absurd} 🚨`;
      stateBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span> Generada`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (msg) {
        toast.querySelector('span:last-child').textContent = msg;
      }
      toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2500);
    }

    function copyGeneratedExcuse() {
      const text = document.getElementById('generatedExcuseText').innerText.replace(/^"|"$/g, '');
      navigator.clipboard.writeText(text);
      showToast('¡Excusa copiada al portapapeles! 🚀');
    }

    function copyCardText(btn, text) {
      navigator.clipboard.writeText(text);
      const icon = btn.querySelector('.material-symbols-outlined');
      const original = icon.textContent;
      icon.textContent = 'check';
      btn.classList.add('bg-primary-fixed', 'text-primary');
      showToast('¡Excusa copiada! 🚀');
      setTimeout(() => {
        icon.textContent = original;
        btn.classList.remove('bg-primary-fixed', 'text-primary');
      }, 1500);
    }

    function shareWhatsApp() {
      const text = document.getElementById('generatedExcuseText').innerText;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('Oye, no voy a poder ir: ' + text)}`, '_blank');
    }
  </script>
